<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Velkommen til kurset – KI for bank og finans – kursmateriell</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         background: linear-gradient(135deg, #002776 0%, #00509E 100%); color: #1F2933; }
  main { background: #fff; border-radius: 8px; padding: 2.5rem 2rem; width: min(90vw, 380px);
         box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .logo { display: block; width: 100%; height: auto; margin-bottom: 1.2rem; }
  h1 { font-size: 1.4rem; margin: .4rem 0 1rem; color: #002776; }
  p { line-height: 1.5; }
  label { display: block; font-weight: 600; margin: 1.2rem 0 .4rem; }
  input[type=password] { width: 100%; box-sizing: border-box; padding: .65rem .75rem; font-size: 1rem;
         border: 1px solid #9AA5B1; border-radius: 6px; }
  input[type=password]:focus { outline: 2px solid #00509E; border-color: #00509E; }
  .remember { display: flex; gap: .5rem; align-items: center; margin: .9rem 0 1.2rem; font-size: .95rem; }
  button { width: 100%; padding: .75rem; font-size: 1rem; font-weight: 700; color: #fff; background: #00509E;
         border: 0; border-radius: 6px; cursor: pointer; }
  button:hover { background: #002776; }
  button:disabled { opacity: .6; cursor: wait; }
  .error { color: #B42318; min-height: 1.4em; margin: .8rem 0 0; font-size: .95rem; }
  .help { font-size: .85rem; color: #52606D; margin-top: 1.5rem; }
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/img/logo-iot.svg" alt="NTNU – Institutt for industriell økonomi og teknologiledelse">
  <h1>Kunstig intelligens for bank og finans</h1>
  <p>Kursmateriellet er bare tilgjengelig for påmeldte deltakere. Skriv inn passordet du har fått tilsendt.</p>
  <form id="login">
    <label for="pw">Passord</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <div class="remember">
      <input id="remember" type="checkbox">
      <label for="remember" style="margin:0;font-weight:400">Husk meg på denne enheten</label>
    </div>
    <button id="submit" type="submit">Logg inn</button>
    <p class="error" id="error" role="alert"></p>
  </form>
  <p class="help">Har du ikke fått passord? Kontakt kursansvarlig.</p>
</main>

  async function decrypt(rawKey) {
    const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(payload.iv) }, key, fromB64(payload.data));
    return new TextDecoder().decode(plain);
  }

  function show(htmlText) {
    document.open();
    document.write(htmlText);
    document.close();
  }

  async function tryStoredKey() {
    const stored = sessionStorage.getItem(STORE) || localStorage.getItem(STORE);
    if (!stored) return;
    try {
      show(await decrypt(fromB64(stored)));
    } catch (e) {
      // Gammel nøkkel (f.eks. etter passordbytte) – be om nytt passord
      sessionStorage.removeItem(STORE);
      localStorage.removeItem(STORE);
    }
  }

  document.getElementById("login").addEventListener("submit", async function (event) {
    event.preventDefault();
    const button = document.getElementById("submit");
    const error = document.getElementById("error");
    button.disabled = true;
    error.textContent = "";
    try {
      const rawKey = await deriveBits(document.getElementById("pw").value);
      const htmlText = await decrypt(rawKey);
      const storage = document.getElementById("remember").checked ? localStorage : sessionStorage;
      storage.setItem(STORE, toB64(rawKey));
      show(htmlText);
    } catch (e) {
      error.textContent = window.crypto && crypto.subtle
        ? "Feil passord. Prøv igjen."
        : "Nettleseren din støtter ikke dekryptering. Prøv en annen nettleser.";
      button.disabled = false;
    }
  });

  tryStoredKey();
})();
</script>
</body>
</html>
